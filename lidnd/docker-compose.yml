services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: will
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: dnd
    ports:
      - "5432:5432"
    volumes:
      - lidnd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U will -d dnd"]
      interval: 2s
      timeout: 2s
      retries: 30

  # S3-compatible storage used in place of real AWS in dev/test mode.
  # The AWS SDK talks to this the same way it talks to S3 (see AWS_ENDPOINT_URL).
  minio:
    # minio/minio is deprecated on Docker Hub; images now live on quay.io.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devkey
      MINIO_ROOT_PASSWORD: devsecret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lidnd-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot job: creates the dev bucket and makes it publicly readable,
  # mirroring the real bucket's public-read config. Exits once done.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devkey devsecret123 &&
      mc mb -p local/lidnd-dev-assets &&
      mc anonymous set download local/lidnd-dev-assets
      "

volumes:
  lidnd-db-data:
  lidnd-minio-data:
